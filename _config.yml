# Site Settings
locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Personal academic homepage of Junteng Liu"
url                      : "https://valyboslej.github.io"
baseurl                  : "/LJT-Homepage"
repository               : "valyboslej/LJT-Homepage"

# Site Author
author:
  name             : "Junteng Liu"
  avatar           :
  bio              : "First-year Ph.D. candidate at HKUST NLP Group, researching natural language processing and machine learning."
  location         :
  employer         : "Hong Kong University of Science and Technology"
  email            : "jliugi@connect.ust.hk"
  github           : "Vicent0205"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter          : "junteng88716710"

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - node_modules
  - LICENSE
  - README.md
  - tmp
  - vendor

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Hong_Kong
